<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Infrastructure Watchlist</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; padding: 0; background: #fbf6e9; }
  body {
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    color: #1a1714;
    font-size: 13px;
    line-height: 1.4;
  }
  .wrap {
    background: #fbf6e9;
    padding: 22px 26px 32px;
    min-height: 100vh;
    box-sizing: border-box;
    max-width: 1500px;
    margin: 0 auto;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid #1a1714;
    padding-bottom: 8px;
    margin-bottom: 14px;
  }
  h1 { font-size: 18px; font-weight: 500; margin: 0; letter-spacing: 0.3px; }
  .meta { font-size: 11px; color: #5a4f3d; font-family: ui-sans-serif, system-ui, sans-serif; }
  .meta .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #6b8f4a; margin-right: 4px; vertical-align: 1px; }
  .meta .dot.loading { background: #c0903a; animation: pulse 1.2s infinite; }
  .meta .dot.err { background: #a94442; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }

  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px;
    color: #5a4f3d;
    position: relative;
    flex-wrap: wrap;
  }
  .toolbar input {
    background: transparent; border: 1px solid #1a1714; color: #1a1714;
    font: inherit; padding: 4px 8px; width: 220px; border-radius: 0; outline: none;
  }
  .toolbar button {
    background: transparent; border: 1px solid #1a1714; color: #1a1714;
    font: inherit; padding: 4px 10px; cursor: pointer; border-radius: 0;
  }
  .toolbar button:hover { background: #1a1714; color: #fbf6e9; }

  .col-wrap { position: relative; display: inline-block; }
  .colmenu {
    position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
    background: #fbf6e9; border: 1px solid #1a1714;
    padding: 6px 10px; z-index: 10; display: none; white-space: nowrap;
  }
  .colmenu.open { display: block; }
  .colmenu label {
    display: flex; align-items: center; gap: 6px; padding: 2px 0;
    cursor: pointer; font-size: 11px; color: #1a1714;
  }
  .colmenu input[type="checkbox"] {
    accent-color: #1a1714; width: 12px; height: 12px; margin: 0; flex-shrink: 0;
  }

  .table-scroll { overflow-x: auto; border: 1px solid #1a1714; }
  table { width: 100%; border-collapse: collapse; background: transparent; table-layout: auto; }
  th, td {
    border: 1px solid #1a1714; padding: 6px 10px; text-align: left;
    vertical-align: middle; white-space: nowrap;
  }
  th:first-child, td:first-child { border-left: none; }
  th:last-child, td:last-child { border-right: none; }
  thead tr th { border-top: none; }
  tbody tr:last-child td { border-bottom: none; }

  th {
    font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    background: #f1e8d2; cursor: pointer; user-select: none;
  }
  th .arrow { font-size: 9px; opacity: 0.5; margin-left: 4px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: ui-sans-serif, system-ui, sans-serif; min-width: 78px; }
  td.notes { white-space: normal; min-width: 160px; max-width: 280px; }
  td.muted { color: #8a7d65; }
  td[contenteditable="true"]:focus { outline: none; background: #fff8e8; box-shadow: inset 0 0 0 1px #1a1714; }
  tbody tr:hover td { background: rgba(26,23,20,0.03); }
  td.up { color: #2f6b3a; }
  td.down { color: #8a2f2a; }

  td select {
    background: transparent; border: none; font: inherit; color: inherit;
    padding: 0; margin: 0; width: 100%; outline: none; cursor: pointer;
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px;
    appearance: none; -webkit-appearance: none;
  }
  td select:focus { background: #fff8e8; }
  td.tag-buy   { background: #dde9cf; color: #2a5e2f; }
  td.tag-sell  { background: #f1d6d3; color: #7a2924; }
  td.tag-long  { background: #dde9cf; color: #2a5e2f; }
  td.tag-short { background: #f1d6d3; color: #7a2924; }
  td.tag-buy select, td.tag-sell select, td.tag-long select, td.tag-short select { color: inherit; }
  /* keep tagged backgrounds even on row hover */
  tbody tr:hover td.tag-buy   { background: #d3e3c4; }
  tbody tr:hover td.tag-sell  { background: #ecccc8; }
  tbody tr:hover td.tag-long  { background: #d3e3c4; }
  tbody tr:hover td.tag-short { background: #ecccc8; }

  /* lock state */
  body.locked td[contenteditable="false"]:not(.num) { cursor: default; }
  body:not(.locked) #lockBtn { background: #1a1714; color: #fbf6e9; }
  #syncStatus { font-size: 10px; color: #8a7d65; }

  /* modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(26,23,20,0.45);
    display: none; align-items: flex-start; justify-content: center;
    z-index: 100; padding-top: 80px; backdrop-filter: blur(2px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fbf6e9; border: 1px solid #1a1714;
    width: 420px; max-width: calc(100vw - 40px);
    padding: 22px 24px 18px; box-shadow: 0 10px 40px rgba(26,23,20,0.25);
  }
  .modal h2 {
    margin: 0 0 14px; font-size: 15px; font-weight: 500;
    letter-spacing: 0.4px; text-transform: uppercase;
    border-bottom: 1px solid #1a1714; padding-bottom: 8px;
  }
  .modal form { display: flex; flex-direction: column; gap: 10px; }
  .modal label {
    display: flex; flex-direction: column; gap: 3px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    color: #5a4f3d;
  }
  .modal input, .modal select, .modal textarea {
    background: transparent; border: 1px solid #1a1714; color: #1a1714;
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px;
    padding: 6px 8px; border-radius: 0; outline: none; text-transform: none;
    letter-spacing: 0;
  }
  .modal input:focus, .modal select:focus, .modal textarea:focus {
    background: #fff8e8;
  }
  .modal textarea { resize: vertical; min-height: 50px; font-family: inherit; }
  .modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal .actions {
    display: flex; gap: 8px; justify-content: flex-end;
    margin-top: 8px; padding-top: 12px; border-top: 1px solid #1a1714;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .modal .actions button {
    background: transparent; border: 1px solid #1a1714; color: #1a1714;
    font-size: 11px; padding: 5px 14px; cursor: pointer; border-radius: 0;
  }
  .modal .actions button[type="submit"] { background: #1a1714; color: #fbf6e9; }
  .modal .actions button:hover { opacity: 0.85; }
  .modal .hint { font-size: 10px; color: #8a7d65; margin: 4px 0 0; font-family: ui-sans-serif, system-ui, sans-serif; text-transform: none; letter-spacing: 0; }
  .modal .err { color: #8a2f2a; }

  footer {
    margin-top: 14px; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px;
    color: #8a7d65; border-top: 1px solid #1a1714; padding-top: 8px;
    display: flex; justify-content: space-between;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI Infrastructure Watchlist</h1>
    <div class="meta"><span class="dot loading" id="dot"></span><span id="status">loading…</span></div>
  </header>

  <div class="toolbar">
    <button id="addBtn" title="Add a new ticker">+ add row</button>
    <input id="filter" placeholder="filter by ticker, name, industry…" />
    <span class="col-wrap">
      <button id="colsBtn">columns ▾</button>
      <div class="colmenu" id="colmenu"></div>
    </span>
    <button id="reload" title="Refresh data">reload</button>
    <button id="lockBtn" title="Unlock editing with the shared password">🔒 unlock</button>
    <span style="flex:1"></span>
    <span id="syncStatus" class="meta" style="margin-right:10px"></span>
    <span id="count"></span>
  </div>

  <div class="modal-overlay" id="addModal">
    <div class="modal" role="dialog" aria-modal="true">
      <h2>Add row</h2>
      <form id="addForm">
        <label>Ticker
          <input name="ticker" autocomplete="off" autocapitalize="characters" required placeholder="e.g. NVDA" />
        </label>
        <label>Company
          <input name="company" autocomplete="off" placeholder="e.g. Nvidia" />
        </label>
        <div class="row2">
          <label>Exchange
            <input name="exchange" autocomplete="off" placeholder="NASDAQ" />
          </label>
          <label>Industry
            <input name="industry" autocomplete="off" placeholder="AI Accelerators" />
          </label>
        </div>
        <label>Notes
          <textarea name="notes" placeholder="optional"></textarea>
        </label>
        <div class="row2">
          <label>Buy / Sell
            <select name="trade">
              <option value="">—</option>
              <option value="Buy">Buy</option>
              <option value="Sell">Sell</option>
            </select>
          </label>
          <label>Short / Long
            <select name="position">
              <option value="">—</option>
              <option value="Long">Long</option>
              <option value="Short">Short</option>
            </select>
          </label>
        </div>
        <p class="hint" id="addHint">Ticker is required. % columns will populate automatically.</p>
        <div class="actions">
          <button type="button" id="addCancel">cancel</button>
          <button type="submit" id="addSubmit">add</button>
        </div>
      </form>
    </div>
  </div>

  <div class="table-scroll">
    <table id="grid">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <footer>
    <span>cells are editable — edits persist locally. % columns refresh from market data.</span>
    <span>data: massive.com</span>
  </footer>
</div>

<script>
const COLUMNS = [
  { key: "company",  label: "Company",  type: "text" },
  { key: "ticker",   label: "Ticker",   type: "text" },
  { key: "exchange", label: "Exchange", type: "text" },
  { key: "industry", label: "Industry", type: "text" },
  { key: "notes",    label: "Notes",    type: "notes" },
  { key: "trade",    label: "Buy / Sell",   type: "select", options: ["", "Buy", "Sell"] },
  { key: "position", label: "Short / Long", type: "select", options: ["", "Long", "Short"] },
  { key: "d1", label: "1 Day",    type: "pct" },
  { key: "d5", label: "5 Day",    type: "pct" },
  { key: "m1", label: "1 Month",  type: "pct" },
  { key: "m6", label: "6 Months", type: "pct" },
  { key: "y1", label: "1 Year",   type: "pct" },
  { key: "marketCap",label: "Market Cap",  type: "money" },
  { key: "pe",       label: "P/E",         type: "ratio" },
  { key: "revGrowth",label: "Rev YoY",     type: "pctSigned" },
  { key: "gross",    label: "Gross Margin",type: "pctPlain" },
  { key: "evEbitda", label: "EV/EBITDA",   type: "ratio" },
  { key: "debtEbitda",label:"Debt/EBITDA", type: "ratio" },
  { key: "fcfYield", label: "FCF Yield",   type: "pctPlain" },
];

const SEED = [
  ["Apple","AAPL","NASDAQ","Consumer Electronics"],
  ["Microsoft","MSFT","NASDAQ","Cloud / Software / AI"],
  ["Alphabet","GOOGL","NASDAQ","Search / Cloud / AI"],
  ["Amazon","AMZN","NASDAQ","E-commerce / Cloud"],
  ["Nvidia","NVDA","NASDAQ","AI Accelerators"],
  ["Meta","META","NASDAQ","Social / AI"],
  ["Tesla","TSLA","NASDAQ","EV / AI"],
  ["Oracle","ORCL","NYSE","Database / Cloud"],
  ["AMD","AMD","NASDAQ","Semiconductors"],
  ["Intel","INTC","NASDAQ","Semiconductors / Foundry"],
  ["Broadcom","AVGO","NASDAQ","Custom ASICs / Networking"],
  ["Marvell","MRVL","NASDAQ","Custom ASICs / DSP"],
  ["ARM Holdings","ARM","NASDAQ","Semiconductor IP"],
  ["TSMC","TSM","NYSE ADR","Semiconductor Foundry"],
  ["ASML","ASML","NASDAQ","Semiconductor Equipment"],
  ["Micron","MU","NASDAQ","Memory"],
  ["Western Digital","WDC","NYSE","HDD Storage"],
  ["Seagate","STX","NASDAQ","HDD Storage"],
  ["Sandisk","SNDK","NASDAQ","NAND / SSD"],
  ["GSI Technology","GSIT","NASDAQ","SRAM"],
  ["Lumentum","LITE","NASDAQ","Photonics"],
  ["Coherent Corp","COHR","NYSE","Photonics"],
  ["MKS Instruments","MKSI","NASDAQ","Photonics / Lasers"],
  ["nLight","LASR","NASDAQ","Photonics / Lasers"],
  ["STMicroelectronics","STM","NYSE","Semiconductors / Photonics"],
  ["Hamamatsu Photonics","HPHTY","OTC ADR","Photonics (NKT owner)"],
  ["Furukawa Electric","FUWAY","OTC ADR","Optical Fiber"],
  ["Sumitomo Electric","SMTOY","OTC ADR","Optical Fiber / CPO"],
  ["Mitsubishi Electric","MIELY","OTC ADR","Photonics / Industrial"],
  ["Infineon","IFNNY","OTC ADR","GaN / Power Semis"],
  ["Renesas","RNECY","OTC ADR","GaN / MCUs"],
  ["Arista Networks","ANET","NYSE","Networking"],
  ["Cisco Systems","CSCO","NASDAQ","Networking / Software"],
  ["Astera Labs","ALAB","NASDAQ","Interconnect Silicon"],
  ["Super Micro","SMCI","NASDAQ","AI Servers"],
  ["Dell Technologies","DELL","NYSE","Servers / PCs"],
  ["HPE","HPE","NYSE","Servers / Networking"],
  ["Vertiv","VRT","NYSE","Power & Cooling"],
  ["Eaton","ETN","NYSE","Electrical Infrastructure"],
  ["Generac","GNRC","NYSE","Power Backup"],
  ["Bloom Energy","BE","NYSE","Fuel Cells"],
  ["GE Vernova","GEV","NYSE","Power Generation"],
  ["Constellation Energy","CEG","NASDAQ","Nuclear Utility"],
  ["Vistra","VST","NYSE","Nuclear / Gas Utility"],
  ["Public Service Enterprise","PEG","NYSE","Utility"],
  ["Oklo","OKLO","NYSE","Small Modular Reactor"],
  ["NuScale","SMR","NYSE","Small Modular Reactor"],
  ["CoreWeave","CRWV","NASDAQ","GPU Cloud"],
  ["Nebius","NBIS","NASDAQ","GPU Cloud"],
  ["Synopsys","SNPS","NASDAQ","EDA / Chip Design"],
  ["Cadence","CDNS","NASDAQ","EDA / Chip Design"],
  ["Palantir","PLTR","NASDAQ","Enterprise Software"],
  ["Core Scientific","CORZ","NASDAQ","Crypto / AI Hosting"],
  ["Cipher Mining","CIFR","NASDAQ","Crypto / AI Hosting"],
  ["IREN","IREN","NASDAQ","Crypto / AI Hosting"],
  ["Riot Platforms","RIOT","NASDAQ","Crypto / AI Hosting"],
  ["Bitdeer","BTDR","NASDAQ","Crypto / AI Hosting"],
  ["Applied Digital","APLD","NASDAQ","Data Center Hosting"],
  ["VanEck Semiconductor ETF","SMH","NASDAQ","Semiconductor ETF"],
  ["Infosys","INFY","NYSE ADR","IT Services"],
];

const STORAGE_KEY = "watchlist_edits_v2";
const VISKEY = "watchlist_visible_cols_v3";
const HIST_CACHE_KEY = "watchlist_hist_v1";
const USER_ROWS_KEY = "watchlist_user_rows_v1";

// hoisted state
let edits = {};
let userRows = [];
let editPassword = localStorage.getItem("edit_password") || "";
let isUnlocked = false;
let pendingMigration = null;

function loadUserRows(){
  try { const a = JSON.parse(localStorage.getItem(USER_ROWS_KEY) || "[]"); return Array.isArray(a) ? a : []; }
  catch { return []; }
}
// userRows / edits now live on the server; we keep an in-memory copy.
// Pre-existing localStorage entries are queued for migration to the server on first authenticated load.
function saveUserRows(){ schedulePush(); }

userRows = loadUserRows();
if (userRows.length){
  pendingMigration = { ...(pendingMigration || {}), userRows: userRows.slice() };
}

let rows = SEED.map((r,i) => ({
  id: i, company: r[0], ticker: r[1], exchange: r[2], industry: r[3],
  notes: "", trade: "", position: "",
  d1: null, d5: null, m1: null, m6: null, y1: null, marketCap: null, pe: null, revGrowth: null, gross: null, evEbitda: null, debtEbitda: null, fcfYield: null, fundamentalsLoading: true,
  _price: null, loading: true, _user: false,
}));
// append persisted user rows
for (const u of userRows){
  rows.push({
    id: rows.length,
    company: u.company || "", ticker: (u.ticker || "").toUpperCase(),
    exchange: u.exchange || "", industry: u.industry || "",
    notes: u.notes || "", trade: u.trade || "", position: u.position || "",
    d1: null, d5: null, m1: null, m6: null, y1: null, marketCap: null, pe: null, revGrowth: null, gross: null, evEbitda: null, debtEbitda: null, fcfYield: null, fundamentalsLoading: true,
    _price: null, loading: true, _user: true,
  });
}

// pick up any legacy localStorage edits for one-time migration to the server
{
  let oldLocal = {};
  try { oldLocal = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch {}
  if (oldLocal && Object.keys(oldLocal).length){
    pendingMigration = { ...(pendingMigration || {}), edits: oldLocal };
  }
}

function getEdit(rowId, col){ return edits[rowId+":"+col]; }
function setEdit(rowId, col, val){
  const key = rowId+":"+col;
  if (val === undefined || val === null || val === "") delete edits[key];
  else edits[key] = val;
  schedulePush();
}

let pushTimer = null;
function schedulePush(){
  if (!isUnlocked) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushState, 600);
}

async function pushState(){
  if (!isUnlocked || !editPassword) return;
  const syncEl = $("#syncStatus");
  syncEl.textContent = "saving…";
  try {
    const res = await fetch("/api/state", {
      method: "PUT",
      headers: { "Content-Type": "application/json", "x-edit-password": editPassword },
      body: JSON.stringify({ edits, userRows }),
    });
    if (res.status === 401){
      isUnlocked = false; editPassword = "";
      localStorage.removeItem("edit_password");
      updateLockUI();
      syncEl.textContent = "auth expired";
      alert("Edit password is wrong or has changed. Click 🔒 unlock again.");
      return;
    }
    if (!res.ok){ syncEl.textContent = "save failed"; console.warn("push failed", res.status); return; }
    syncEl.textContent = "saved";
    setTimeout(() => { if (syncEl.textContent === "saved") syncEl.textContent = ""; }, 1500);
  } catch (e){
    syncEl.textContent = "offline";
    console.warn(e);
  }
}

async function loadServerState(){
  try {
    const res = await fetch("/api/state");
    if (!res.ok) return;
    const data = await res.json();
    edits = (data && data.edits && typeof data.edits === "object") ? data.edits : {};
    const serverUserRows = Array.isArray(data && data.userRows) ? data.userRows : [];
    // hydrate userRows from server: rebuild rows array from SEED + server userRows
    userRows = serverUserRows.slice();
    rebuildRowsFromSeed();
  } catch (e){ console.warn("could not load server state", e); }
}

function rebuildRowsFromSeed(){
  // strip user rows from `rows`, re-append from current userRows
  rows = rows.filter(r => !r._user);
  for (const u of userRows){
    rows.push({
      id: rows.length,
      company: u.company || "", ticker: (u.ticker || "").toUpperCase(),
      exchange: u.exchange || "", industry: u.industry || "",
      notes: u.notes || "", trade: u.trade || "", position: u.position || "",
      d1: null, d5: null, m1: null, m6: null, y1: null, marketCap: null, pe: null, revGrowth: null, gross: null, evEbitda: null, debtEbitda: null, fcfYield: null, fundamentalsLoading: true,
      _price: null, loading: true, _user: true,
    });
  }
}

function updateLockUI(){
  const btn = $("#lockBtn");
  if (!btn) return;
  if (isUnlocked){
    btn.textContent = "🔓 unlocked";
    btn.title = "Click to lock editing";
  } else {
    btn.textContent = "🔒 unlock";
    btn.title = "Unlock editing with the shared password";
  }
  document.body.classList.toggle("locked", !isUnlocked);
}

async function tryUnlock(pwd){
  // verify by attempting a no-op PUT of current state
  const res = await fetch("/api/state", {
    method: "PUT",
    headers: { "Content-Type": "application/json", "x-edit-password": pwd },
    body: JSON.stringify({ edits, userRows }),
  });
  return res.ok;
}

let visibleCols = new Set(COLUMNS.map(c => c.key));
try {
  const saved = JSON.parse(localStorage.getItem(VISKEY) || "null");
  if (Array.isArray(saved)) visibleCols = new Set(saved);
} catch {}
function saveVis(){ try { localStorage.setItem(VISKEY, JSON.stringify([...visibleCols])); } catch {} }

let sortKey = null, sortDir = 1;
let filterText = "";

const $ = (s) => document.querySelector(s);
const tbody = $("#rows");
const headRow = $("#headRow");
const status = $("#status");
const dot = $("#dot");

function fmtPct(v){
  if (v === null || v === undefined || isNaN(v)) return "—";
  const sign = v > 0 ? "+" : "";
  return sign + Number(v).toFixed(2) + "%";
}
function fmtPctPlain(v){
  if (v === null || v === undefined || isNaN(v)) return "—";
  return Number(v).toFixed(1) + "%";
}
function fmtRatio(v){
  if (v === null || v === undefined || isNaN(v)) return "—";
  const n = Number(v);
  if (Math.abs(n) >= 1000) return n.toFixed(0);
  return n.toFixed(1);
}
// Finnhub returns market cap in millions of USD
function fmtMoneyMillions(v){
  if (v === null || v === undefined || isNaN(v)) return "—";
  const n = Number(v);
  if (n >= 1_000_000) return "$" + (n / 1_000_000).toFixed(2) + "T";
  if (n >= 1_000)     return "$" + (n / 1_000).toFixed(1) + "B";
  return "$" + n.toFixed(0) + "M";
}
function pctClass(v){
  if (v === null || v === undefined || isNaN(v)) return "muted";
  if (v > 0) return "up"; if (v < 0) return "down"; return "";
}
const NUMERIC_TYPES = new Set(["pct","pctSigned","pctPlain","ratio","money"]);
function isNumericType(t){ return NUMERIC_TYPES.has(t); }
function getCellValue(row, col){
  const e = getEdit(row.id, col);
  if (e !== undefined) return e;
  return row[col];
}
function activeColumns(){ return COLUMNS.filter(c => visibleCols.has(c.key)); }

function renderHead(){
  headRow.innerHTML = "";
  for (const c of activeColumns()){
    const th = document.createElement("th");
    th.dataset.sort = c.key;
    if (isNumericType(c.type)) th.classList.add("num");
    th.innerHTML = c.label + '<span class="arrow"></span>';
    th.addEventListener("click", () => {
      if (sortKey === c.key) sortDir = -sortDir;
      else { sortKey = c.key; sortDir = 1; }
      render();
    });
    headRow.appendChild(th);
  }
}

function render(){
  renderHead();
  const q = filterText.trim().toLowerCase();
  const filtered = rows.filter(r => {
    if (!q) return true;
    return [r.company, r.ticker, r.exchange, r.industry, getCellValue(r,"notes")]
      .some(x => (x||"").toString().toLowerCase().includes(q));
  });
  if (sortKey){
    const colDef = COLUMNS.find(c => c.key === sortKey);
    const isNum = colDef && isNumericType(colDef.type);
    filtered.sort((a,b) => {
      let av = getCellValue(a, sortKey);
      let bv = getCellValue(b, sortKey);
      if (isNum){
        av = (av === null || av === undefined || av === "") ? -Infinity : parseFloat(av);
        bv = (bv === null || bv === undefined || bv === "") ? -Infinity : parseFloat(bv);
      } else {
        av = (av||"").toString().toLowerCase();
        bv = (bv||"").toString().toLowerCase();
      }
      if (av < bv) return -1*sortDir;
      if (av > bv) return  1*sortDir;
      return 0;
    });
  }
  tbody.innerHTML = "";
  for (const r of filtered){
    const tr = document.createElement("tr");
    tr.dataset.id = r.id;
    for (const c of activeColumns()){
      const td = document.createElement("td");
      td.dataset.col = c.key;
      const raw = getCellValue(r, c.key);
      const editedFlag = getEdit(r.id, c.key) !== undefined;
      if (c.type === "pct" || c.type === "pctSigned"){
        td.classList.add("num", "readonly");
        td.contentEditable = "false";
        td.tabIndex = -1;
        if (r.loading){ td.textContent = "…"; td.classList.add("muted"); }
        else {
          td.textContent = fmtPct(raw);
          const cls = pctClass(raw);
          if (cls) td.classList.add(cls);
        }
      } else if (c.type === "pctPlain"){
        td.classList.add("num", "readonly");
        td.contentEditable = "false";
        td.tabIndex = -1;
        if (r.fundamentalsLoading) { td.textContent = "…"; td.classList.add("muted"); }
        else {
          td.textContent = fmtPctPlain(raw);
          if (raw === null || raw === undefined || isNaN(raw)) td.classList.add("muted");
        }
      } else if (c.type === "ratio"){
        td.classList.add("num", "readonly");
        td.contentEditable = "false";
        td.tabIndex = -1;
        if (r.fundamentalsLoading) { td.textContent = "…"; td.classList.add("muted"); }
        else {
          td.textContent = fmtRatio(raw);
          if (raw === null || raw === undefined || isNaN(raw)) td.classList.add("muted");
        }
      } else if (c.type === "money"){
        td.classList.add("num", "readonly");
        td.contentEditable = "false";
        td.tabIndex = -1;
        if (r.fundamentalsLoading) { td.textContent = "…"; td.classList.add("muted"); }
        else {
          td.textContent = fmtMoneyMillions(raw);
          if (raw === null || raw === undefined || isNaN(raw)) td.classList.add("muted");
        }
      } else if (c.type === "select"){
        const sel = document.createElement("select");
        for (const opt of c.options){
          const o = document.createElement("option");
          o.value = opt; o.textContent = opt || "—";
          if ((raw || "") === opt) o.selected = true;
          sel.appendChild(o);
        }
        sel.disabled = !isUnlocked;
        sel.addEventListener("change", () => { setEdit(r.id, c.key, sel.value); render(); });
        td.appendChild(sel);
        const v = (raw || "").toLowerCase();
        if (v) td.classList.add("tag-" + v);
      } else if (c.type === "notes"){
        td.classList.add("notes"); td.contentEditable = isUnlocked ? "true" : "false"; td.textContent = raw || "";
      } else {
        td.contentEditable = isUnlocked ? "true" : "false"; td.textContent = raw || "";
      }
      if (editedFlag && c.type !== "select" && c.type !== "pct") td.classList.add("edited");
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  $("#count").textContent = filtered.length + " rows";
  document.querySelectorAll("th").forEach(th => {
    const a = th.querySelector(".arrow");
    if (!a) return;
    a.textContent = (th.dataset.sort === sortKey) ? (sortDir === 1 ? "▲" : "▼") : "";
  });
}

tbody.addEventListener("focusin", (e) => {
  const td = e.target.closest("td");
  if (!td || td.contentEditable !== "true") return;
  td.dataset._before = td.textContent;
});
tbody.addEventListener("focusout", (e) => {
  const td = e.target.closest("td");
  if (!td || td.contentEditable !== "true") return;
  const before = td.dataset._before;
  const now = td.textContent.trim();
  if (now === before) return;
  const tr = td.closest("tr");
  const id = parseInt(tr.dataset.id, 10);
  setEdit(id, td.dataset.col, now);
  td.classList.toggle("edited", true);
});
tbody.addEventListener("keydown", (e) => {
  const td = e.target.closest("td");
  if (!td || td.contentEditable !== "true") return;
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); td.blur(); }
  if (e.key === "Escape"){
    e.preventDefault();
    if (td.dataset._before !== undefined) td.textContent = td.dataset._before;
    td.blur();
  }
});

async function commitNewRow(data, snapHit){
  const newRow = {
    id: rows.length,
    company: data.company, ticker: data.ticker,
    exchange: data.exchange, industry: data.industry,
    notes: data.notes, trade: data.trade, position: data.position,
    d1: null, d5: null, m1: null, m6: null, y1: null, marketCap: null, pe: null, revGrowth: null, gross: null, evEbitda: null, debtEbitda: null, fcfYield: null, fundamentalsLoading: true,
    _price: null, loading: true, _user: true,
  };
  if (snapHit){ newRow.d1 = snapHit.d1; newRow._price = snapHit.price; }
  rows.push(newRow);

  userRows.push({
    company: data.company, ticker: data.ticker, exchange: data.exchange,
    industry: data.industry, notes: data.notes, trade: data.trade, position: data.position,
  });
  saveUserRows(userRows);

  render();

  // populate historical series
  try {
    const bars = await fetchBarsWithRetry(data.ticker, 4);
    if (bars.length){
      if (newRow.d1 === null && bars.length >= 2){
        const last = bars[bars.length-1].c;
        const prev = bars[bars.length-2].c;
        if (last && prev) newRow.d1 = ((last - prev) / prev) * 100;
      }
      newRow.d5 = pctChangeOverDays(bars, 7);
      newRow.m1 = pctChangeOverDays(bars, 30);
      newRow.m6 = pctChangeOverDays(bars, 182);
      newRow.y1 = pctChangeOverDays(bars, 365);
      // merge into hist cache so reloads keep the values
      const cache = loadHistCache();
      const fresh = (cache.date === todayIso() ? (cache.data || {}) : {});
      fresh[data.ticker] = { d5: newRow.d5, m1: newRow.m1, m6: newRow.m6, y1: newRow.y1 };
      saveHistCache({ date: todayIso(), data: fresh });
    }
  } catch (e){ console.warn("history fetch failed for new row", e); }
  newRow.loading = false;
  render();
}

// ---- data layer ----
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

async function callApi(path, params = {}){
  const qs = new URLSearchParams();
  qs.set("path", path);
  for (const [k, v] of Object.entries(params)){
    if (v === undefined || v === null) continue;
    qs.set(k, String(v));
  }
  const res = await fetch("/api/proxy?" + qs.toString());
  if (!res.ok){
    const text = await res.text();
    throw new Error(`HTTP ${res.status}: ${text.slice(0, 200)}`);
  }
  return res.json();
}

function daysAgoIso(n){
  const d = new Date(); d.setUTCDate(d.getUTCDate() - n);
  return d.toISOString().slice(0,10);
}
function todayIso(){ return new Date().toISOString().slice(0,10); }

function pickSnapshotPctPrice(item){
  // Be liberal in what we accept across snapshot response shapes.
  const session = item.session || item.day || {};
  const pct = (typeof session.change_percent === "number") ? session.change_percent
            : (typeof session.change_perc === "number") ? session.change_perc
            : (typeof item.todays_change_perc === "number") ? item.todays_change_perc
            : (typeof session.session_change_percent === "number") ? session.session_change_percent
            : null;
  const price = (typeof session.price === "number") ? session.price
              : (typeof session.close === "number") ? session.close
              : (typeof item.last_trade === "object" && item.last_trade && typeof item.last_trade.price === "number") ? item.last_trade.price
              : (typeof item.lastTrade === "object" && item.lastTrade && typeof item.lastTrade.p === "number") ? item.lastTrade.p
              : null;
  return { pct, price };
}

async function fetchSnapshot(tickers){
  const json = await callApi("/v3/snapshot", { "ticker.any_of": tickers.join(",") });
  const out = {};
  const arr = json.results || json.data || [];
  for (const item of arr){
    const t = item.ticker || item.symbol;
    if (!t) continue;
    const { pct, price } = pickSnapshotPctPrice(item);
    out[t] = { d1: pct, price };
  }
  return out;
}

async function fetchBarsWithRetry(ticker, maxAttempts = 4){
  const from = daysAgoIso(400);
  const to = todayIso();
  let lastErr = null;
  for (let attempt = 1; attempt <= maxAttempts; attempt++){
    try {
      const json = await callApi(
        `/v2/aggs/ticker/${encodeURIComponent(ticker)}/range/1/day/${from}/${to}`,
        { adjusted: "true", sort: "asc", limit: "500" }
      );
      const arr = json.results || [];
      const bars = arr.map(b => ({ t: Number(b.t), c: Number(b.c) }))
                      .filter(b => b.c && !isNaN(b.t));
      if (bars.length) return bars;
      if (attempt < maxAttempts) await sleep(400 * attempt);
    } catch (e){
      lastErr = e;
      if (attempt < maxAttempts) await sleep(500 * Math.pow(3, attempt - 1));
    }
  }
  if (lastErr) console.warn(`bars failed for ${ticker} after ${maxAttempts} attempts`, lastErr);
  return [];
}

function pctChangeOverDays(bars, days){
  if (!bars || bars.length < 2) return null;
  const last = bars[bars.length-1];
  const targetT = last.t - days*24*3600*1000;
  let ref = null;
  for (let i = bars.length-2; i >= 0; i--){
    if (bars[i].t <= targetT){ ref = bars[i]; break; }
  }
  if (!ref) ref = bars[0];
  if (!ref.c || !last.c) return null;
  return ((last.c - ref.c) / ref.c) * 100;
}

function loadHistCache(){
  try { return JSON.parse(localStorage.getItem(HIST_CACHE_KEY) || "{}"); }
  catch { return {}; }
}
function saveHistCache(c){ try { localStorage.setItem(HIST_CACHE_KEY, JSON.stringify(c)); } catch {} }

async function load(){
  const tickers = SEED.map(r => r[1]);

  status.textContent = "fetching current prices…";
  let snap = {};
  try { snap = await fetchSnapshot(tickers); }
  catch (e){ console.warn("snapshot failed", e); }
  for (const r of rows){
    const s = snap[r.ticker];
    if (s){ r.d1 = s.d1; r._price = s.price; }
  }
  render();

  const today = todayIso();
  const cache = loadHistCache();
  const cachedToday = cache.date === today ? (cache.data || {}) : {};
  const needFetch = [];
  for (const t of tickers){
    if (cachedToday[t]){
      const r = rows.find(x => x.ticker === t);
      if (r){
        const v = cachedToday[t];
        r.d5 = v.d5; r.m1 = v.m1; r.m6 = v.m6; r.y1 = v.y1;
      }
    } else {
      needFetch.push(t);
    }
  }
  for (const r of rows){ if (cachedToday[r.ticker]) r.loading = false; }
  render();

  if (needFetch.length === 0){
    dot.classList.remove("loading");
    const now = new Date();
    status.textContent = `updated ${now.toLocaleString([], { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" })} (cached)`;
    return;
  }

  const fresh = { ...cachedToday };
  const CHUNK = 3;
  let done = 0;
  for (let i = 0; i < needFetch.length; i += CHUNK){
    const batch = needFetch.slice(i, i + CHUNK);
    await Promise.all(batch.map(async (t) => {
      const r = rows.find(x => x.ticker === t);
      const bars = await fetchBarsWithRetry(t);
      if (r){
        if (bars.length){
          if (r.d1 === null && bars.length >= 2){
            const last = bars[bars.length-1].c;
            const prev = bars[bars.length-2].c;
            if (last && prev) r.d1 = ((last - prev) / prev) * 100;
          }
          r.d5 = pctChangeOverDays(bars, 7);
          r.m1 = pctChangeOverDays(bars, 30);
          r.m6 = pctChangeOverDays(bars, 182);
          r.y1 = pctChangeOverDays(bars, 365);
          fresh[t] = { d5: r.d5, m1: r.m1, m6: r.m6, y1: r.y1 };
        }
        r.loading = false;
      }
      done++;
    }));
    status.textContent = `loading history… ${done}/${needFetch.length}`;
    render();
    saveHistCache({ date: today, data: fresh });
    if (i + CHUNK < needFetch.length) await sleep(220);
  }

  // healing passes — keep retrying any ticker missing any of d1/d5/m1/m6/y1.
  // up to 3 rounds; some values may be legitimately null (e.g. recent IPOs lack 1y history).
  for (let round = 1; round <= 3; round++){
    const incomplete = rows.filter(r =>
      r.d1 === null || r.d5 === null || r.m1 === null || r.m6 === null || r.y1 === null
    );
    if (!incomplete.length) break;
    status.textContent = `healing pass ${round}: ${incomplete.length} tickers…`;
    await sleep(600 * round);
    for (let i = 0; i < incomplete.length; i += 3){
      const batch = incomplete.slice(i, i + 3);
      await Promise.all(batch.map(async (r) => {
        const bars = await fetchBarsWithRetry(r.ticker, 4);
        if (!bars.length) return;
        if (r.d1 === null && bars.length >= 2){
          const last = bars[bars.length-1].c;
          const prev = bars[bars.length-2].c;
          if (last && prev) r.d1 = ((last - prev) / prev) * 100;
        }
        if (r.d5 === null) r.d5 = pctChangeOverDays(bars, 7);
        if (r.m1 === null) r.m1 = pctChangeOverDays(bars, 30);
        if (r.m6 === null) r.m6 = pctChangeOverDays(bars, 182);
        if (r.y1 === null) r.y1 = pctChangeOverDays(bars, 365);
        fresh[r.ticker] = { d5: r.d5, m1: r.m1, m6: r.m6, y1: r.y1 };
      }));
      saveHistCache({ date: today, data: fresh });
      render();
      await sleep(220);
    }
  }

  for (const r of rows) r.loading = false;
  dot.classList.remove("loading");
  const now = new Date();
  status.textContent = `updated ${now.toLocaleString([], { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" })}`;
  render();
}

// ---- fundamentals (Finnhub) ----
const FUND_CACHE_KEY = "watchlist_fundamentals_v1";
function loadFundCache(){
  try { return JSON.parse(localStorage.getItem(FUND_CACHE_KEY) || "{}"); } catch { return {}; }
}
function saveFundCache(c){ try { localStorage.setItem(FUND_CACHE_KEY, JSON.stringify(c)); } catch {} }

// pull the metric we want from Finnhub's response, accepting a few field-name variants
function pickFundamentals(metric){
  if (!metric || typeof metric !== "object") return null;
  const num = (k) => {
    const v = metric[k];
    return (typeof v === "number" && !isNaN(v)) ? v : null;
  };
  const first = (...keys) => {
    for (const k of keys){ const v = num(k); if (v !== null) return v; }
    return null;
  };

  // P/E (TTM, basic excluding extras)
  const pe = first("peBasicExclExtraTTM","peExclExtraTTM","peTTM","peNormalizedAnnual");

  // Revenue growth YoY (TTM)
  const revGrowth = first("revenueGrowthTTMYoy","revenueGrowthQuarterlyYoy","revenueGrowth5Y");

  // Gross margin (TTM)
  const gross = first("grossMarginTTM","grossMarginAnnual","grossMargin5Y");

  // EV/EBITDA — Finnhub keys vary
  const evEbitda = first("currentEv/ebitdaTTM","currentEv/ebitda","evToEbitda","evToEbitdaTTM");

  // Debt/EBITDA — try direct, fall back to net-debt / ebitda
  let debtEbitda = first("totalDebt/ebitdaTTM","netDebt/ebitdaTTM","totalDebt/EBITDA","netDebt/EBITDA");
  if (debtEbitda === null){
    const totalDebt = first("totalDebtAnnual","totalDebtInterim","totalDebtQuarterly");
    const ebitda    = first("ebitdaTTM","ebitda","ebitdaAnnual","ebitdaCagr5Y");
    if (totalDebt !== null && ebitda !== null && ebitda !== 0) debtEbitda = totalDebt / ebitda;
  }

  // FCF Yield — direct field, else FCF / market cap, else invert EV/FCF
  let fcfYield = first("freeCashFlowYieldTTM","freeCashFlowYieldAnnual");
  if (fcfYield === null){
    const fcf = first("freeCashFlowTTM","freeCashFlowAnnual");
    const mcap = first("marketCapitalization");
    if (fcf !== null && mcap && mcap !== 0) fcfYield = (fcf / mcap) * 100;
  }
  if (fcfYield === null){
    const evFcf = first("currentEv/freeCashFlowTTM","currentEv/freeCashFlowAnnual");
    if (evFcf && evFcf !== 0) fcfYield = (1 / evFcf) * 100; // approximation
  }

  // Market cap (Finnhub returns millions of USD)
  const marketCap = first("marketCapitalization");

  return { pe, revGrowth, gross, evEbitda, debtEbitda, fcfYield, marketCap };
}

async function fetchFundamentals(ticker){
  const res = await fetch(`/api/fundamentals?symbol=${encodeURIComponent(ticker)}`);
  if (!res.ok) throw new Error(`fundamentals HTTP ${res.status}`);
  const json = await res.json();
  return pickFundamentals(json && json.metric);
}

async function loadFundamentals(){
  const tickers = rows.map(r => r.ticker).filter(Boolean);
  const today = todayIso();
  const cache = loadFundCache();
  const cachedToday = cache.date === today ? (cache.data || {}) : {};
  const need = [];
  for (const t of tickers){
    if (cachedToday[t]){
      const r = rows.find(x => x.ticker === t);
      if (r){ Object.assign(r, cachedToday[t]); r.fundamentalsLoading = false; }
    } else {
      need.push(t);
    }
  }
  if (!need.length){ for (const r of rows) r.fundamentalsLoading = false; render(); return; }

  // Finnhub free tier: 60 calls/min — chunk small with pacing
  const fresh = { ...cachedToday };
  const CHUNK = 4;
  for (let i = 0; i < need.length; i += CHUNK){
    const batch = need.slice(i, i + CHUNK);
    await Promise.all(batch.map(async (t) => {
      try {
        const v = await fetchFundamentals(t);
        if (v){
          const r = rows.find(x => x.ticker === t);
          if (r) Object.assign(r, v);
          fresh[t] = v;
        }
      } catch (e){ console.warn("fundamentals failed for", t, e); }
      finally {
        const r = rows.find(x => x.ticker === t);
        if (r) r.fundamentalsLoading = false;
      }
    }));
    saveFundCache({ date: today, data: fresh });
    render();
    if (i + CHUNK < need.length) await sleep(1200); // ~50 req/min target
  }
  for (const r of rows) r.fundamentalsLoading = false;
  render();
}

async function bootstrap(){
  await loadServerState();
  if (editPassword) isUnlocked = true;
  updateLockUI();
  buildColMenu();
  render();
  // market data + fundamentals run in parallel — they hit independent rate budgets
  load().catch(e => {
    console.error(e);
    dot.classList.remove("loading"); dot.classList.add("err");
    status.textContent = "error: " + (e.message || e);
  });
  loadFundamentals().catch(e => console.warn("fundamentals load failed", e));
}

bootstrap();
</script>
